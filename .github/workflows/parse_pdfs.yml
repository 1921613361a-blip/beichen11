name: Parse PDFs To Artifacts

on:
  push:
    paths:
      - "**/*.pdf"
      - "**/*.PDF"
      - "pdf_pipeline.py"
      - "requirements.txt"
      - ".github/workflows/parse_pdfs.yml"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Build PDF list
        id: pdfs
        shell: bash
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            find . -type f \( -iname "*.pdf" \) | sed 's#^\./##' > pdfs_to_parse.txt
          else
            git diff --name-only HEAD^ HEAD | awk 'BEGIN{IGNORECASE=1} /\.pdf$/ {print}' > pdfs_to_parse.txt
          fi
          count=$(wc -l < pdfs_to_parse.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "PDF count: $count"
          cat pdfs_to_parse.txt || true

      - name: Parse PDFs
        if: steps.pdfs.outputs.count != '0'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
        run: |
          python pdf_pipeline.py --pdf-list-file pdfs_to_parse.txt --out-dir parsed_results

      - name: Upload parsed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsed_results_${{ github.run_number }}
          path: |
            parsed_results
            pdfs_to_parse.txt
          if-no-files-found: warn
          retention-days: 14

      - name: No PDF found
        if: steps.pdfs.outputs.count == '0'
        run: echo "No PDF found."
