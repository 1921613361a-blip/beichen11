name: Parse New PDFs With Skill

on:
  push:
    paths:
      - "**/*.pdf"
      - "**/*.PDF"
      - "quant_paper_skill.py"
      - "requirements.txt"
      - ".github/workflows/parse_pdfs.yml"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Build target PDF list
        id: targets
        shell: bash
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            find . -type f \( -iname "*.pdf" \) | sed 's#^\./##' > target_pdfs.txt
          else
            git diff --name-only --diff-filter=A HEAD^ HEAD -- '*.pdf' '*.PDF' > target_pdfs.txt || true
          fi
          count=$(grep -c . target_pdfs.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Target PDF count: $count"
          cat target_pdfs.txt || true

      - name: Run your skill
        if: steps.targets.outputs.count != '0'
        env:
          LLM_PROVIDER: deepseek
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
        run: |
          python -m pip install -U openai anthropic pypdf pymupdf docling
          mkdir -p parsed_results
          while IFS= read -r pdf; do
            [[ -z "$pdf" ]] && continue
            echo "Processing: $pdf"
            python quant_paper_skill.py --pdf "$pdf" --out-dir parsed_results --format both
          done < target_pdfs.txt

      - name: Upload parsed artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsed_results_${{ github.run_number }}
          path: |
            parsed_results
            target_pdfs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: No PDF found
        if: steps.targets.outputs.count == '0'
        run: echo "No PDF found."
