name: Parse PDFs To Artifacts

on:
  push:
    paths:
      - "**/*.pdf"
      - "**/*.PDF"
      - "pdf_pipeline.py"
      - "requirements.txt"
      - ".github/workflows/parse_pdfs.yml"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug file list
        run: |
          echo "== repo files =="
          ls -la
          echo "== pdf files =="
          find . -type f \( -iname "*.pdf" \) -print || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Parse PDFs (auto discover)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
        run: |
          python pdf_pipeline.py --out-dir parsed_results

      - name: Upload parsed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsed_results_${{ github.run_number }}
          path: |
            parsed_results
          if-no-files-found: warn
          retention-days: 14
